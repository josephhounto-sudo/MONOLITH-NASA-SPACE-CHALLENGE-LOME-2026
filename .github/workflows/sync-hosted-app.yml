# Every push to main rebuilds m3-design (the branch the hosted Streamlit app follows) as main + one marker commit.
# The marker line in requirements.txt makes Streamlit Community Cloud reinstall and RESTART the app, so
# already-imported modules (style, rules, glyphs) are reloaded instead of staying stale.
name: sync-hosted-app
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git checkout -B m3-design
          echo "# hosted-sync ${GITHUB_SHA}" >> requirements.txt
          git commit -am "hosted app: restart marker for ${GITHUB_SHA::7}"
          git push origin m3-design --force
