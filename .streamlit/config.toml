# Dark navy base for the "fusion" look (glass on navy, cream actions). Values mirror csync/config/theme.json -> navy.
[theme]
base = "dark"
primaryColor = "#F4EDE0"
backgroundColor = "#14213D"
secondaryBackgroundColor = "#0B1426"
textColor = "#F4EDE0"
font = "sans serif"

[browser]
gatherUsageStats = false
